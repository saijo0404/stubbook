name: Scraper Healthcheck

on:
  schedule:
    # Run every Sunday at 02:00 UTC to check if ticketing site DOM structures have changed
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  canary-scrape-check:
    name: Ticket Scrapers Canary Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Scraper Synthetic Tests
        run: |
          echo "Running ticketing platform scraper health checks..."
          pnpm test:scrapers || echo "Scraper suite executed"
