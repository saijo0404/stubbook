name: Scraper Healthcheck

on:
  schedule:
    # Run every Sunday at 02:00 UTC to check if ticketing site DOM structures have changed
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  canary-scrape-check:
    name: Ticket Scrapers Canary Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Scraper Synthetic Tests
        run: pnpm test:scrapers
