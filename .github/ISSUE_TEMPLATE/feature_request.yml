name: ✨ 功能建議 (Feature Request)
description: 提出針對 StubBook 的新功能或 UX 改進建議
title: "[Feature]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        歡迎提出任何能夠讓 StubBook 更好用的點子！
  - type: dropdown
    id: category
    attributes:
      label: 功能領域 (Category)
      options:
        - 🎫 網頁解析與活動抓取 (Scraping Pipeline)
        - 📖 個人回憶與票根手帳 (Memories & Ticket Stubs)
        - 📊 統計分析與年度回顧 (Stats & Concert Wrapped)
        - 🎵 歌單與外部服務串接 (Spotify / Setlist.fm)
        - 📱 多平台與離線體驗 (Mobile / PWA / Cross-platform)
        - 🔐 隱私、備份與帳號安全 (Privacy & Auth)
        - 🎨 UI/UX 設計優化 (Design & Interface)
        - 🚀 其他 (Other)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 痛點或需求背景 (Problem / Context)
      description: 目前的體驗有何不足，或為什麼需要這個功能？
      placeholder: 經常需要手動輸入曲目，若能自動抓取該場次的 Setlist 將會節省很多時間...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建議的解決方案 (Proposed Solution)
      description: 你心目中這個功能應該如何運作？
      placeholder: 希望在活動結束後，詳情頁提供「同步現場 Setlist」按鈕...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案 (Alternatives Considered)
      description: 是否有嘗試過其他解決方式或現有工具？
